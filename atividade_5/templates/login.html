<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 5 - Login</title>
    <style>
        body {background-color: #f4f4f9; padding: 50px; text-align: center; }
        .login-box { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .alert { margin-top: 15px; font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Área de Login</h2>
        
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuário" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <!-- Exibe a mensagem de sucesso ou erro se ela existir -->
        {% if mensagem %}
            <p class="alert">{{ mensagem }}</p>
        {% endif %}
    </div>

</body>
</html>
